<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cabinet Médical SABOUGNOUMA-Djidian</title>
</head>
<body>
    <h1>Gestion du Cabinet Médical SABOUGNOUMA-Djidian</h1>

    <!-- Formulaire d'exemple pour tester l'ajout -->
    <input type="text" id="nomPatient" placeholder="Nom du patient">
    <button onclick="ajouterPatient()">Enregistrer le patient</button>

    <!-- Scripts Firebase -->
    <script type="module">
        // Importation des SDK Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Votre configuration Firebase (récupérée depuis votre écran)
        const firebaseConfig = {
            apiKey: "AIzaSyCRqTzEbySZD3k3bmAVY5Hjh...", // Votre clé complète
            authDomain: "cabinet-sabougnouma.firebaseapp.com",
            databaseURL: "https://cabinet-sabougnouma-default-rtdb.firebaseio.com",
            projectId: "cabinet-sabougnouma",
            storageBucket: "cabinet-sabougnouma.appspot.com",
            messagingSenderId: "13994625867",
            appId: "1:13994625867:web:1fc5c5e26ef53...",
            measurementId: "G-KH890S7XL2"
        };

        // Initialisation
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fonction d'enregistrement de test
        window.ajouterPatient = async function() {
            const nom = document.getElementById("nomPatient").value;
            if (!nom) {
                alert("Veuillez entrer un nom !");
                return;
            }

            try {
                await addDoc(collection(db, "patients"), {
                    nom: nom,
                    date: new Date()
                });
                alert("Patient enregistré dans Firebase avec succès !");
                document.getElementById("nomPatient").value = "";
            } catch (e) {
                console.error("Erreur : ", e);
                alert("Erreur lors de l'enregistrement.");
            }
        };
    </script>
</body>
</html>
